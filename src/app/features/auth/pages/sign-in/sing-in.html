<h2>Iniciar sesión</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Usuario
    <input type="text" formControlName="username" />
  </label>

  <label>
    Contraseña
    <input type="password" formControlName="password" />
  </label>

  <button type="submit" [disabled]="loading || form.invalid">Entrar</button>

  <div *ngIf="error" class="error">{{ error }}</div>
</form>

<hr/>

<button type="button" (click)="signInWithGoogle()">Entrar con Google</button>
<button type="button" (click)="signInWithMicrosoft()">Entrar con Microsoft</button>
