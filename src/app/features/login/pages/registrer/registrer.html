<div class="login-container">
  <h2>Registrarse</h2>
  <form>
    <div>
      <label>Nombre</label>
      <input
        type="User"
        id="User"
        name="User"
        placeholder="Nombre"
        [(ngModel)]="loginData.name"
        required
      />

    </div>
    <div>
      <label>Apellidos</label>
      <input
        type="User"
        id="User"
        name="User"
        placeholder="Usuario"
        [(ngModel)]="loginData.surname"
        required
      />

    </div>
    <div>
      <label>Email</label>
      <input
        type="User"
        id="User"
        name="User"
        placeholder="Usuario"
        [(ngModel)]="loginData.email"
        required
      />

    </div>
    <div>
      <label>Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Contraseña"
        [(ngModel)]="loginData.password"
        required
      />
    </div>
    <div>
    <label>Contraseña</label>
    <input
      type="password"
      id="repeatPassword"
      name="repeatPassword"
      placeholder="Repetir Contraseña"
      [(ngModel)]="loginData.password"
      required
    />
</div>
    <div>
      <div>
        <button>Registrarme</button>
      </div>
      <div>
        <button>Cancelar</button>
      </div>
    </div>
  </form>
</div>
