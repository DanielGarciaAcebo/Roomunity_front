<div class="h-full min-h-0 flex gap-4 p-4" *ngIf="vm$ | async as vm">
  <!-- Left: Lists -->
  <aside class="w-80 bg-app-surface border border-app-border rounded-2xl p-4 flex flex-col">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold">
        {{ 'SHOPPING.LISTS' | translate }}
      </h2>

      <button
        type="button"
        (click)="createList()"
        class="rounded-xl bg-primary px-3 py-2 text-sm font-semibold text-white hover:bg-primary-dark transition"
      >
        {{ 'SHOPPING.NEW_LIST' | translate }}
      </button>
    </div>

    <div *ngIf="vm.error" class="mb-3 rounded-xl border border-app-border bg-app-bg p-3 text-sm text-accent">
      {{ vm.error }}
    </div>

    <div class="flex-1 overflow-auto space-y-2">
      <button
        *ngFor="let l of vm.lists"
        type="button"
        (click)="store.select(l.id)"
        class="w-full text-left rounded-xl border border-app-border p-3 hover:bg-app-bg transition"
        [class.bg-app-bg]="vm.selected?.id === l.id"
      >
        <div class="font-medium">{{ l.title }}</div>
        <div class="text-xs text-app-muted">{{ l.items.length }} {{ 'SHOPPING.ITEMS' | translate }}</div>
      </button>
    </div>
  </aside>

  <!-- Right: Items -->
  <section class="flex-1 min-h-0 bg-app-surface border border-app-border rounded-2xl p-4 flex flex-col">
    <ng-container *ngIf="vm.selected as selected; else emptyState">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div>
          <h1 class="text-xl font-bold">{{ selected.title }}</h1>
          <p class="text-sm text-app-muted">{{ 'SHOPPING.SUBTITLE' | translate }}</p>
        </div>

        <div class="flex gap-2">
          <button
            type="button"
            (click)="renameList(selected)"
            class="rounded-xl border border-app-border bg-app-surface px-3 py-2 text-sm hover:bg-app-bg transition"
          >
            {{ 'SHOPPING.RENAME' | translate }}
          </button>

          <button
            type="button"
            (click)="deleteList(selected)"
            class="rounded-xl border border-app-border bg-app-surface px-3 py-2 text-sm hover:bg-app-bg transition"
          >
            {{ 'SHOPPING.DELETE' | translate }}
          </button>
        </div>
      </div>

      <form class="flex gap-2 mb-4" (ngSubmit)="addItem(selected.id)">
        <input
          type="text"
          name="newItemName"
          [(ngModel)]="newItemName"
          class="flex-1 rounded-xl border border-app-border bg-white px-4 py-2 outline-none focus:ring-2 focus:ring-primary/40"
          [placeholder]="'SHOPPING.ADD_PLACEHOLDER' | translate"
          required
        />

        <input
          type="number"
          name="newItemQty"
          [(ngModel)]="newItemQty"
          min="1"
          class="w-24 rounded-xl border border-app-border bg-white px-4 py-2 outline-none focus:ring-2 focus:ring-primary/40"
        />

        <button
          type="submit"
          class="rounded-xl bg-primary px-4 py-2 font-semibold text-white hover:bg-primary-dark transition"
        >
          {{ 'SHOPPING.ADD' | translate }}
        </button>
      </form>

      <div class="flex-1 min-h-0 overflow-auto space-y-2">
        <div
          *ngFor="let item of selected.items"
          class="flex items-center gap-3 rounded-xl border border-app-border p-3"
        >
          <input
            type="checkbox"
            [checked]="item.done"
            (change)="store.toggleItem(selected.id, item.id)"
            class="h-4 w-4"
          />

          <div class="flex-1">
            <div class="font-medium" [class.line-through]="item.done" [class.text-app-muted]="item.done">
              {{ item.text }}
            </div>
          </div>

          <input
            type="number"
            min="1"
            class="w-20 rounded-xl border border-app-border bg-white px-3 py-2 outline-none focus:ring-2 focus:ring-primary/40"
            [value]="item.qty"
            (change)="store.updateQty(selected.id, item.id, ($any($event.target).valueAsNumber))"
          />

          <button
            type="button"
            (click)="store.removeItem(selected.id, item.id)"
            class="rounded-xl border border-app-border bg-app-surface px-3 py-2 text-sm hover:bg-app-bg transition"
          >
            {{ 'SHOPPING.REMOVE' | translate }}
          </button>
        </div>template
      </div>
    </ng-container>

    <ng-template #emptyState>
      <div class="h-full flex items-center justify-center text-app-muted">
        <div *ngIf="vm.isLoading; else noSelection">
          Loading...
        </div>
        <ng-template #noSelection>
          {{ 'SHOPPING.EMPTY' | translate }}
        </ng-template>
      </div>
    </ng-template>
  </section>
</div>
